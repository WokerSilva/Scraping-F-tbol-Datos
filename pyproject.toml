[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "besoccer-scraper"
version = "0.1.0"
description = "BeSoccer scraper"
requires-python = ">=3.10"
dependencies = [
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "python-dotenv"]

[project.scripts]
besoccer = "besoccer_scraper.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
